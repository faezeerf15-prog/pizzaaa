<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ed7428">
<title>Pizza Dash: Birthday Run!</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#21151a;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;touch-action:none}body{display:grid;place-items:center}.game-wrap{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);background:#2a1715;box-shadow:0 0 50px #0008}canvas{display:block;width:100%;height:100%;outline:none}.hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:#fff9;pointer-events:none}
</style></head><body><div class="game-wrap"><canvas id="game" width="960" height="540" aria-label="Pizza Dash game"></canvas><div class="hint">ARROWS / SWIPE • Tap to continue</div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const W=960,H=540,ground=430;
let state='intro',level=1,score=0,runTime=0,speed=350,spawnPizza=0,spawnObstacle=0,items=[],particles=[],clouds=[],last=0,player={y:ground,vy:0,jumping:false,sliding:0,anim:0},audio=null,musicOn=true,shake=0;
const targets=[50,100,200],themes=[['#f9a34b','#f17834','#bc4b21','#81371f'],['#f8ca68','#e99a3a','#bf5e2b','#5e3a35'],['#ec8251','#bb4d37','#752e35','#452b42']];
for(let i=0;i<9;i++)clouds.push({x:Math.random()*W,y:40+Math.random()*175,s:.55+Math.random()*1.3});
function audioCtx(){if(!audio){try{audio=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(audio&&audio.state==='suspended')audio.resume();return audio}
function tone(freq,dur=.13,type='sine',vol=.08,delay=0){const a=audioCtx();if(!a)return;let o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,a.currentTime+delay);g.gain.setValueAtTime(.001,a.currentTime+delay);g.gain.exponentialRampToValueAtTime(vol,a.currentTime+delay+.015);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+delay+dur);o.connect(g);g.connect(a.destination);o.start(a.currentTime+delay);o.stop(a.currentTime+delay+dur+.03)}
function birthday(){// cheerful birthday-song placeholder, synthesized locally
 [392,392,440,392,523,494,392,392,440,392,587,523,392,392,784,659,523,494,440,698,698,659,523,587,523].forEach((n,i)=>tone(n,.23,'triangle',.045,i*.25));}
function sfx(kind){if(kind==='pizza'){tone(760,.08,'sine',.08);tone(1080,.11,'triangle',.045,.06)}else if(kind==='jump')tone(330,.17,'triangle',.05);else if(kind==='hit'){tone(130,.3,'sawtooth',.08);tone(80,.35,'square',.035,.08)}else if(kind==='win'){[523,659,784,1047].forEach((n,i)=>tone(n,.25,'triangle',.07,i*.13))}}
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=3;ctx.strokeStyle=stroke;ctx.stroke()}}
function text(t,x,y,size=24,color='#fff',weight=700,align='center'){ctx.textAlign=align;ctx.textBaseline='middle';ctx.font=`${weight} ${size}px system-ui, sans-serif`;ctx.fillStyle=color;ctx.fillText(t,x,y)}
function button(label,x,y,w,h,sub=''){rounded(x,y,w,h,18,'#fff2df','#7f3823');rounded(x+4,y+4,w-8,h-8,14,'#e96227','#ffbf60');text(label,x+w/2,y+h/2-(sub?8:0),25,'#fff',900);if(sub)text(sub,x+w/2,y+h/2+17,13,'#ffe9c7',700)}
function bg(){let c=themes[level-1]||themes[0],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,c[0]);g.addColorStop(1,c[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // warm sun
 ctx.globalAlpha=.72;ctx.fillStyle='#ffe9a0';ctx.beginPath();ctx.arc(790,112,54,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 clouds.forEach(o=>{ctx.fillStyle='#fff3cc66';ctx.beginPath();ctx.ellipse(o.x,o.y,48*o.s,15*o.s,0,0,7);ctx.ellipse(o.x-25*o.s,o.y+3,23*o.s,14*o.s,0,0,7);ctx.ellipse(o.x+24*o.s,o.y+1,25*o.s,13*o.s,0,0,7);ctx.fill()});
 // distant pizza/food themed silhouettes
 let off=(runTime*speed*.12)%240;for(let x=-240-off;x<W+240;x+=240){ctx.fillStyle=level===1?'#bc572b55':level===2?'#843f3e66':'#512b4666';ctx.beginPath();ctx.moveTo(x,ground);ctx.lineTo(x+100,ground-105);ctx.lineTo(x+205,ground);ctx.fill();ctx.fillStyle='#ffd07188';ctx.beginPath();ctx.arc(x+104,ground-67,12,0,7);ctx.fill();}
 // ground
 ctx.fillStyle=c[2];ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#f5c05f';ctx.fillRect(0,ground,W,10);ctx.fillStyle='#813c2c';let off2=(runTime*speed*.8)%90;for(let x=-90-off2;x<W+90;x+=90){ctx.beginPath();ctx.moveTo(x,ground+12);ctx.lineTo(x+53,ground+12);ctx.lineTo(x+19,ground+32);ctx.lineTo(x-34,ground+32);ctx.fill()}
 // level flavor label
 let labels=['SUNSET PIZZA PLAZA','CHEESE CANYON','PEPPERONI PEAK'];text(labels[level-1],W/2,ground+82,15,'#ffe4a1',900);
}
function pizza(x,y){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(runTime*6+x)*.1);ctx.shadowColor='#692814';ctx.shadowBlur=8;ctx.fillStyle='#e58b25';ctx.beginPath();ctx.moveTo(-22,-18);ctx.lineTo(25,0);ctx.lineTo(-17,22);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#a74421';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#ffd858';ctx.beginPath();ctx.moveTo(-18,-15);ctx.lineTo(20,0);ctx.lineTo(-14,18);ctx.closePath();ctx.fill();for(let [a,b] of [[-4,-5],[7,2],[-8,8]]){ctx.fillStyle='#c84729';ctx.beginPath();ctx.arc(a,b,3.8,0,7);ctx.fill()}ctx.restore()}
function bomb(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#252632';ctx.beginPath();ctx.arc(0,0,21,0,7);ctx.fill();ctx.strokeStyle='#f7a544';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(9,-17);ctx.quadraticCurveTo(25,-31,18,-38);ctx.stroke();ctx.fillStyle='#ffd360';ctx.beginPath();ctx.arc(18,-39,5,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-7,-6,3,0,7);ctx.arc(7,-6,3,0,7);ctx.fill();ctx.restore()}
function garfield(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#ed8729';ctx.beginPath();ctx.ellipse(0,-30,34,34,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-27,-49);ctx.lineTo(-34,-75);ctx.lineTo(-11,-60);ctx.moveTo(27,-49);ctx.lineTo(34,-75);ctx.lineTo(11,-60);ctx.fill();ctx.fillStyle='#fff3cf';ctx.beginPath();ctx.ellipse(-11,-34,9,11,0,0,7);ctx.ellipse(11,-34,9,11,0,0,7);ctx.fill();ctx.fillStyle='#17151a';ctx.beginPath();ctx.arc(-9,-33,3,0,7);ctx.arc(9,-33,3,0,7);ctx.fill();ctx.fillStyle='#5c3425';ctx.fillRect(-28,-12,56,12);ctx.fillStyle='#f7bf5c';for(let x1=-21;x1<24;x1+=15)ctx.fillRect(x1,-9,7,4);ctx.restore()}
function hero(){let x=170,y=player.y,slide=player.sliding>0;ctx.save();ctx.translate(x,y);if(slide){ctx.rotate(-.04);ctx.fillStyle='#f07a27';ctx.beginPath();ctx.ellipse(1,-20,39,18,0,0,7);ctx.fill();ctx.fillStyle='#333';ctx.fillRect(-30,-8,23,8);ctx.fillRect(12,-9,23,8);head(18,-32,.78)}else{let bob=player.jumping?0:Math.sin(player.anim*13)*3;ctx.translate(0,bob); // legs
 ctx.strokeStyle='#49352f';ctx.lineWidth=9;ctx.lineCap='round';let swing=Math.sin(player.anim*15)*10;ctx.beginPath();ctx.moveTo(-7,-32);ctx.lineTo(-9+swing,-5);ctx.moveTo(8,-32);ctx.lineTo(9-swing,-5);ctx.stroke();ctx.fillStyle='#49352f';ctx.beginPath();ctx.ellipse(-10+swing,-4,15,6,-.12,0,7);ctx.ellipse(10-swing,-4,15,6,.12,0,7);ctx.fill();
 // orange polo body
 ctx.fillStyle='#ed6b20';ctx.beginPath();ctx.moveTo(-21,-77);ctx.quadraticCurveTo(-28,-70,-25,-34);ctx.quadraticCurveTo(0,-26,26,-35);ctx.lineTo(21,-74);ctx.quadraticCurveTo(0,-87,-21,-77);ctx.fill();ctx.fillStyle='#ffd08a';ctx.beginPath();ctx.moveTo(-7,-79);ctx.lineTo(0,-67);ctx.lineTo(8,-80);ctx.lineTo(3,-60);ctx.lineTo(-2,-60);ctx.fill();ctx.fillStyle='#f9b34f';ctx.fillRect(1,-60,3,16);ctx.strokeStyle='#c7501e';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-20,-69);ctx.lineTo(-33,-47);ctx.moveTo(20,-68);ctx.lineTo(32,-49);ctx.stroke();ctx.fillStyle='#f1a66b';ctx.beginPath();ctx.arc(-34,-45,6,0,7);ctx.arc(34,-46,6,0,7);ctx.fill();head(0,-91,1)}ctx.restore()}
function head(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s); // hair
 ctx.fillStyle='#171923';ctx.beginPath();ctx.ellipse(0,-3,22,24,0,0,7);ctx.fill();ctx.fillStyle='#d39a6a';ctx.beginPath();ctx.ellipse(0,2,19,22,0,0,7);ctx.fill();ctx.fillStyle='#151722';ctx.beginPath();ctx.moveTo(-18,-7);ctx.quadraticCurveTo(-22,-29,-2,-29);ctx.quadraticCurveTo(14,-31,21,-14);ctx.lineTo(12,-17);ctx.lineTo(5,-22);ctx.lineTo(-3,-16);ctx.lineTo(-14,-17);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-7,-1,5,6,0,0,7);ctx.ellipse(8,-1,5,6,0,0,7);ctx.fill();ctx.fillStyle='#29202a';ctx.beginPath();ctx.arc(-6,0,2.5,0,7);ctx.arc(9,0,2.5,0,7);ctx.fill();ctx.fillStyle='#d99d68';ctx.beginPath();ctx.moveTo(-1,3);ctx.lineTo(4,10);ctx.lineTo(-1,11);ctx.fill(); // full short beard + mustache
 ctx.fillStyle='#242129';ctx.beginPath();ctx.moveTo(-16,9);ctx.quadraticCurveTo(-12,16,-9,19);ctx.quadraticCurveTo(0,25,10,18);ctx.quadraticCurveTo(17,14,17,8);ctx.quadraticCurveTo(9,14,1,12);ctx.quadraticCurveTo(-8,15,-16,9);ctx.fill();ctx.beginPath();ctx.ellipse(0,11,8,3,0,0,7);ctx.fill();ctx.restore()}
function hud(){rounded(22,18,265,64,16,'#411d1ac9','#ffd36b');text(`LEVEL ${level}`,46,39,15,'#ffd26a',900,'left');text(`${score} / ${targets[level-1]} PIZZAS`,46,62,20,'#fff',900,'left');let p=score/targets[level-1];ctx.fillStyle='#48231d';ctx.fillRect(300,38,300,18);ctx.fillStyle='#ffca51';ctx.fillRect(300,38,300*Math.min(p,1),18);ctx.strokeStyle='#fff1bd';ctx.lineWidth=2;ctx.strokeRect(300,38,300,18);text('🍕',624,48,26);text('↑ JUMP     ↓ SLIDE',W-26,35,15,'#fff5d9',800,'right');}
function spawn(){let x=W+50;if(Math.random()<.49)items.push({type:'pizza',x,y:ground-75-Math.random()*48});else items.push({type:Math.random()<.53?'bomb':'cat',x,y:ground,passed:false});}
function addBurst(x,y,color,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*260,vy:(Math.random()-.8)*230,life:.7+Math.random()*.55,color,size:3+Math.random()*5})}
function collide(){let px=170,py=player.y;for(let i=items.length-1;i>=0;i--){let o=items[i];if(o.type==='pizza'){if(Math.abs(o.x-px)<34&&Math.abs(o.y-(py-47))<45){score++;sfx('pizza');addBurst(o.x,o.y,'#ffe06a',7);items.splice(i,1);if(score>=targets[level-1]){if(level<3){level++;score=0;items=[];spawnPizza=.4;spawnObstacle=1.1;addBurst(480,240,'#fff0a0',35);sfx('win')}else{state='victory';sfx('win')}}}}else{let near=Math.abs(o.x-px)<47;let danger=o.type==='bomb'?(!player.jumping||py>ground-45):player.sliding<=0;if(near&&danger){state='gameover';shake=12;sfx('hit');addBurst(px,py-35,'#ffb84f',20);break}}}}
function update(dt){if(state!=='game')return;runTime+=dt;player.anim+=dt;speed=Math.min(510,350+(level-1)*40+runTime*1.1);if(player.jumping){player.vy+=1450*dt;player.y+=player.vy*dt;if(player.y>=ground){player.y=ground;player.vy=0;player.jumping=false}}if(player.sliding>0)player.sliding-=dt;
 spawnPizza-=dt;spawnObstacle-=dt;if(spawnPizza<=0){let n=3+Math.floor(Math.random()*3);for(let j=0;j<n;j++)items.push({type:'pizza',x:W+40+j*44,y:ground-75-(Math.random()<.25?48:0)});spawnPizza=1.15+Math.random()*.42}
 if(spawnObstacle<=0){items.push({type:Math.random()<.55?'bomb':'cat',x:W+60,y:ground});spawnObstacle=1.85+Math.random()*1.45}
 for(let o of items)o.x-=speed*dt;items=items.filter(o=>o.x>-80);collide();clouds.forEach(c=>{c.x-=speed*.04*dt;if(c.x<-100)c.x=W+100});particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=430*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);}
function render(){ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88;if(shake<.3)shake=0}bg();if(state==='game'){items.forEach(o=>o.type==='pizza'?pizza(o.x,o.y):o.type==='bomb'?bomb(o.x,ground-21):garfield(o.x,ground));hero();particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill()});ctx.globalAlpha=1;hud()}else if(state==='intro')introScreen();else if(state==='tutorial')tutorialScreen();else if(state==='gameover')endScreen(false);else if(state==='victory')endScreen(true);ctx.restore();}
function introScreen(){// dim, party decor
 ctx.fillStyle='#30171766';ctx.fillRect(0,0,W,H);party();rounded(212,32,536,460,32,'#55251fdc','#ffd16b');text('HAPPY BIRTHDAY!',480,72,32,'#ffe08b',1000);text('A special birthday dash',480,108,17,'#ffe9cb',650);cake(480,290);text('32',480,260,39,'#fff2c7',1000);heroPreview();text('Pizza Dash',480,375,37,'#fff',1000);text('Run, collect pizzas, and celebrate!',480,410,17,'#ffe7c8',700);button('START',365,440,230,58,'');text('Birthday tune ♫',480,516,13,'#fff0cc',600)}
function cake(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#f7d48a';ctx.fillRect(-84,15,168,64);ctx.fillStyle='#e96142';ctx.fillRect(-84,45,168,15);ctx.fillStyle='#fff0c1';ctx.beginPath();ctx.ellipse(0,15,84,22,0,0,7);ctx.fill();ctx.fillStyle='#ef8851';ctx.fillRect(-58,-25,116,42);ctx.fillStyle='#ffe2a0';ctx.beginPath();ctx.ellipse(0,-25,58,16,0,0,7);ctx.fill();for(let i=-2;i<=2;i++){ctx.fillStyle='#ffe58b';ctx.fillRect(i*23-3,-56,6,27);ctx.fillStyle='#ff9f3c';ctx.beginPath();ctx.ellipse(i*23,-60,6,10,0,0,7);ctx.fill()}ctx.restore()}
function party(){for(let i=0;i<8;i++){let x=70+(i*137)%820,y=100+(i*83)%280;let colors=['#ffdf69','#fb7762','#ffe9b0','#ff9f40'];ctx.strokeStyle='#fff4cf';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y+33);ctx.quadraticCurveTo(x+12,y+54,x+5,y+70);ctx.stroke();ctx.fillStyle=colors[i%4];ctx.beginPath();ctx.ellipse(x,y,18,24,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(x-4,y+22);ctx.lineTo(x+4,y+22);ctx.lineTo(x,y+29);ctx.fill()}}
function heroPreview(){ctx.save();ctx.translate(725,365);ctx.scale(.75,.75);let old=player.y;player.y=ground;hero();player.y=old;ctx.restore()}
function tutorialScreen(){ctx.fillStyle='#3017178c';ctx.fillRect(0,0,W,H);rounded(130,45,700,440,28,'#53261feF','#ffd16b');text('HOW TO PLAY',480,90,35,'#ffe08b',1000);text('The birthday run has three delicious worlds!',480,133,18,'#ffe8c8',700);const lines=[['🍕','COLLECT PIZZAS','Reach 50, then 100, then 200 pizzas.'],['💣','JUMP OVER BOMBS','Press ↑ / Arrow Up or swipe up.'],['🐱','SLIDE UNDER GARFIELD','Press ↓ / Arrow Down or swipe down.'],['🏁','KEEP RUNNING','The runner moves automatically. Avoid obstacles!']];lines.forEach((a,i)=>{let y=190+i*54;text(a[0],190,y,27);text(a[1],240,y-9,17,'#ffd372',900,'left');text(a[2],240,y+14,15,'#fff2df',600,'left')});button('LET’S RUN!',354,420,252,53);text('Tip: swipe anywhere on the playfield.',480,493,13,'#fff0d6',600)}
function endScreen(win){ctx.fillStyle='#3017179c';ctx.fillRect(0,0,W,H);rounded(210,64,540,405,30,'#51251feF','#ffd16b');if(win){text('PIZZA CHAMPION!',480,116,35,'#ffe08b',1000);trophy(480,238);text('You collected all 350 pizzas!',480,337,23,'#fff',900);text('The birthday hero wins the golden cup!',480,371,16,'#ffe8c8',700);button('PLAY AGAIN',355,408,250,53)}else{text('OOPS! RUN ENDED',480,137,34,'#ffe08b',1000);heroPreview();text(`Pizzas collected: ${score}`,480,318,23,'#fff',900);text(`You were in Level ${level}. Try again!`,480,353,17,'#ffe8c8',700);button('TRY AGAIN',355,397,250,55)}}
function trophy(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#ffd34f';ctx.strokeStyle='#fff1a5';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-48,-55);ctx.lineTo(48,-55);ctx.lineTo(40,2);ctx.quadraticCurveTo(0,49,-40,2);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(-49,-30,22,-1.5,1.5);ctx.arc(49,-30,22,1.6,4.7);ctx.stroke();ctx.fillStyle='#e87928';ctx.fillRect(-9,2,18,32);ctx.fillStyle='#ffd34f';ctx.fillRect(-37,33,74,13);ctx.fillStyle='#fff5c7';ctx.beginPath();ctx.arc(0,-29,11,0,7);ctx.fill();ctx.restore();heroPreview()}
function frame(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(frame)}
function begin(){audioCtx();state='tutorial';}
function startGame(){audioCtx();state='game';level=1;score=0;runTime=0;speed=350;items=[];particles=[];player={y:ground,vy:0,jumping:false,sliding:0,anim:0};spawnPizza=.2;spawnObstacle=2;}
function act(dir){if(state!=='game')return;if(dir==='up'&&!player.jumping&&player.sliding<=0){player.jumping=true;player.vy=-650;sfx('jump')}else if(dir==='down'&&!player.jumping)player.sliding=.72}
let touchStart=null;canvas.addEventListener('pointerdown',e=>{e.preventDefault();audioCtx();let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;touchStart={x:e.clientX,y:e.clientY};if(state==='intro'){birthday();begin()}else if(state==='tutorial'){startGame()}else if(state==='game'){/* gesture is handled on release */}else if(state==='gameover'||state==='victory'){startGame()}});
canvas.addEventListener('pointerup',e=>{if(!touchStart)return;let dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;if(state==='game'){if(Math.abs(dy)>22)act(dy<0?'up':'down');else if(Math.abs(dx)>35)act(dx<0?'up':'down')}touchStart=null});
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();audioCtx();if(state==='intro'&&(e.key==='Enter'||e.key===' ')){birthday();begin()}else if(state==='tutorial'&&(e.key==='Enter'||e.key===' '))startGame();else if(state==='game'){if(e.key==='ArrowUp'||e.key===' ')act('up');if(e.key==='ArrowDown')act('down')}else if((state==='gameover'||state==='victory')&&(e.key==='Enter'||e.key===' '))startGame()});
requestAnimationFrame(frame);
})();
</script></body></html>
